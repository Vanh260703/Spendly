server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # `trailingSlash: true` trong next.config.ts nên mỗi route là một thư mục chứa
    # index.html — giống hệt cách Cloudflare Pages phục vụ. Giữ khớp để bản chạy Docker
    # và bản deploy thật không lệch hành vi.
    location / {
        try_files $uri $uri/ $uri/index.html /404.html;
    }

    # File có hash trong tên (_next/static) không bao giờ đổi nội dung → cache vĩnh viễn
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # `trailingSlash: true` trong next.config.ts nên mỗi route là một thư mục chứa
    # index.html — giống hệt cách Cloudflare Pages phục vụ. Giữ khớp để bản chạy Docker
    # và bản deploy thật không lệch hành vi.
    location / {
        # ⚠️ Kết thúc bằng `=404`, KHÔNG phải `/404.html`.
        #
        # Trỏ thẳng vào file thì nginx phục vụ nó với mã **200** — đường dẫn đã xóa vẫn
        # "tồn tại" dưới góc nhìn của trình duyệt, của bot, và của bất cứ thứ gì kiểm tra
        # bằng mã trạng thái. `=404` trả đúng mã, rồi `error_page` bên dưới mới đắp nội
        # dung trang 404 của Next lên.
        try_files $uri $uri/ $uri/index.html =404;
    }

    # File có hash trong tên (_next/static) không bao giờ đổi nội dung → cache vĩnh viễn
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
